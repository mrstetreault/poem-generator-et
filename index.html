<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js"></script>
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Poem Generator</h1>
      </header>
      <main>
        <form id="poem-form">
          <label for="prompt">Enter a prompt for your poem:</label>
          <input
            class="instruction"
            type="text"
            id="prompt"
            name="prompt"
            autocomplete="off"
            autofocus
            required
          />
          <button type="submit" class="submit-button">Generate Poem</button>
        </form>
        <div id="poem-output" class="poem-output"></div>
      </main>
      <footer>
        This AI project was coded by
        <a href="https://github.com/mrstetreault" target="_blank"
          >Eden Tetreault</a
        >
        and is
        <a
          href="https://github.com/mrstetreault/poem-generator-et"
          target="_blank"
        >
          open-sourced on GitHub</a
        >
        and is
        <a href="https://ai-poem-generator-et.netlify.app/" target="_blank"
          >hosted on Netlify</a
        >.
      </footer>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
